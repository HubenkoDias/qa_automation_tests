name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Take code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Launch Tests
        run: mvn -B test -Dheadless=true
        env:
            HHUB_QA_EMAIL: ${{ secrets.HHUB_QA_EMAIL }}
            HHUB_QA_PASSWORD: ${{ secrets.HHUB_QA_PASSWORD }}
            HHUB_COMPANY_EMAIL: ${{ secrets.HHUB_COMPANY_EMAIL }}
            HHUB_COMPANY_PASSWORD: ${{ secrets.HHUB_COMPANY_PASSWORD }}
            HHUB_ADMIN_EMAIL: ${{ secrets.HHUB_ADMIN_EMAIL }}
            HHUB_ADMIN_PASSWORD: ${{ secrets.HHUB_ADMIN_PASSWORD }}
            HHUB_WRONG_EMAIL: ${{ secrets.HHUB_WRONG_EMAIL }}
            HHUB_WRONG_PASWWORD: ${{ secrets.HHUB_WRONG_PASWWORD }}
            HHUB_SUPABASE_URL: ${{ secrets.HHUB_SUPABASE_URL }}
            HHUB_SUPABASE_ANON_KEY: ${{ secrets.HHUB_SUPABASE_ANON_KEY }}


      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports